[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distri-grid"
version = "0.1.0"
description = "Distributed PyTorch Model Training & On-Demand Compute Grid for Friend & Lab GPUs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
]

[project.scripts]
distri-grid = "distri_grid.cli.main:app"

[tool.setuptools.packages.find]
include = ["distri_grid*"]
